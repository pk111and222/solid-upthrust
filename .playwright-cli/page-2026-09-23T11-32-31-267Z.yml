          - region [ref=f2e579]:
            - heading "约定与边界" [level=2] [ref=f2e580]
            - generic [ref=f2e581]:
              - paragraph [ref=f2e582]: key 在 dataSource 中应唯一，string 与 number 是不同的键。缺失于 dataSource 的受控目标键会保留，但没有可见行；调用方负责清理失效数据。默认值只在初始化时生效，动态数据更新不会自动清除目标键。Form.Item 可注入字段值、禁用与校验状态；显式 targetKeys/disabled/status 优先。
              - paragraph [ref=f2e583]: 原生复选框和按钮支持 Tab、空格与 Enter；面板标题、行勾选和操作按钮都提供可访问名称。列表可滚动，但当前会渲染全部过滤结果，没有虚拟滚动、分页或异步请求协议。render/footer 的内容由调用方负责其内部交互与可访问性。
              - paragraph [ref=f2e584]: 该物料没有公开子组件，也不提供拖拽排序或命令式 ref。真实浏览器专项以 Chromium 为准；跨浏览器、发布与部署另行验收。
          - generic [ref=f2e585]: Solid Upthrust · 基于 Solid 2 构建