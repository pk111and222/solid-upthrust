            - generic [ref=e96]:
              - paragraph [ref=e97]: Transfer 将 dataSource 按 targetKeys 分成左右两侧。勾选仅改变临时 selectedKeys；点击中间按钮才改变最终 targetKeys。两个值都可受控，受控时应在 onSelectChange 与 onChange 中分别写回。
