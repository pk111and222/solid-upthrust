          - heading "TreeSelect 树选择" [level=1] [ref=f1e90]
          - paragraph [ref=f1e91]: 在树形层级中选择单个或多个节点。
          - region [ref=f1e92]:
            - heading "使用方式" [level=2] [ref=f1e93]
            - generic [ref=f1e94]:
              - paragraph [ref=f1e95]: TreeSelect 通过树形弹层选择节点。单选点击节点提交其 value；多选默认显示复选框并联动父子。设置 treeCheckable=false 后，多选改为逐行点选；treeCheckStrictly 则让复选框父子独立。
              - paragraph [ref=f1e96]: 默认 SHOW_PARENT 在整支勾满时只上报最高层的键；SHOW_CHILD 只上报叶节点，SHOW_ALL 上报所有勾选键。value 受控时须在 onChange 中写回；Form.Item 可注入字段值、禁用、尺寸与校验状态。
