            - generic [ref=f1e734]:
              - paragraph [ref=f1e735]: 节点 value 在整棵树中必须唯一，string 与 number 是不同的键。单选清空后 onChange 的 value/nodes 均为 undefined；多选清空后均为空数组。节点 disabled 会禁用该节点及其子树；节点 checkable=false 只跳过当前复选，但仍可向可选后代传导。
              - paragraph [ref=f1e736]: 搜索按 label 忽略大小写包含匹配，保留命中节点的祖先路径。默认虚拟面板使用固定行高，修改节点行高时应同步 listItemHeight；virtual=false 可渲染完整小树。showLine、showIcon、icon、titleRender 和 indent 控制树的连接线、节点图标、标题与层级缩进。组件不提供异步加载、标签自定义渲染或独立公开子组件；TreeInPanel 是内部实现。
              - paragraph [ref=f1e737]: 键盘可用方向键在展开的树中移动，Enter 提交当前节点；Escape 关闭浮层。搜索输入保持焦点时也可使用这些按键。当前真实浏览器回归以 Chromium 为准。
