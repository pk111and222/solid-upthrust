          - paragraph [ref=f4e91]: 按树形路径选择单个或多个节点。
          - region [ref=f4e92]:
            - heading "使用方式" [level=2] [ref=f4e93]
            - generic [ref=f4e94]:
              - paragraph [ref=f4e95]: Cascader 将树形选项按路径拆成多列菜单。单选默认只提交叶节点；设置 changeOnSelect 后中间层级也可提交。多选使用 mode="multiple"，checkable 可显示父子联动复选框。
              - paragraph [ref=f4e96]: 点击或 hover 展开子级，搜索会将匹配节点展平为完整路径。设置 allowClear 后，选中内容时清除按钮会替代下拉箭头。受控 value 需要在 onChange 中写回；Form.Item 可注入值、禁用、尺寸和校验状态。
