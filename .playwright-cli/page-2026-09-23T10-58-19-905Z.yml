          - region [ref=e600]:
            - heading "约定与边界" [level=2] [ref=e601]
            - generic [ref=e602]:
              - paragraph [ref=e603]: value 必须使用路径数组；多选的每项是完整路径。节点 value 在整棵树中应唯一。禁用节点的祖先禁用状态会传递给所有后代。
              - paragraph [ref=e604]: checkable 只保存叶节点路径，父节点的全选、半选状态由后代推导；异步加载需要由调用方更新 options。当前没有公开自定义菜单渲染或浮层容器属性。
              - paragraph [ref=e605]: 真实浏览器证据覆盖 Chromium 的路径选择、搜索、复选联动和静态 docs/example 产物；其他浏览器与打包消费者安装留待工程回归。
          - generic [ref=e606]: Solid Upthrust · 基于 Solid 2 构建
