          - paragraph [ref=e85]: 自由文本输入、候选建议与键盘补全。
          - region [ref=e86]:
            - heading "使用方式" [level=2] [ref=e87]
            - generic [ref=e88]:
              - paragraph [ref=e89]: 从 upthrust-ui 导入 AutoComplete、AutoCompleteProps 与 AutoCompleteOption。值始终是自由文本，不要求来自候选项。默认忽略大小写，在 value 和 label 中做子串匹配；选中后将 label（缺省时为 value）回填到输入框，onSelect 返回选项键和原始对象。
              - paragraph [ref=e90]: 聚焦或输入时展开候选，方向键循环跳过禁用项，Enter 选中并关闭，Escape 关闭，Tab 正常移出焦点。组合输入期间不搜索或选择，结束后提交一次。ref 返回原生 HTMLInputElement，可调用 focus() / blur()。
