          - region [ref=e635]:
            - heading "约定与边界" [level=2] [ref=e636]
            - generic [ref=e637]:
              - paragraph [ref=e638]: value/open 为受控属性，父层需写回回调值。defaultValue/defaultOpen 仅初始化使用。选项 value 必须唯一；label 支持字符串（包含空字符串），不支持 JSX、分组或虚拟列表。空候选显示“无匹配结果”。没有公开子组件。
              - paragraph [ref=e639]: onChange 在输入与选中时触发；onSearch 只由输入触发，选中不会发起搜索。异步请求由调用方管理，通过 options 写入结果；远程过滤应设置 filterOption=false，并处理过期请求和卸载。动态更新 options、value 或过滤器会重新计算候选。
              - paragraph [ref=e640]: Form.Item 可注入值、变更回调、id、禁用、尺寸与校验状态，显式 props 优先。显式 onChange 会接管字段变更，需要调用方自行同步表单。ConfigProvider 支持组件默认属性及主题作用域。name 用于原生表单文本提交，禁用输入不参加提交。
              - paragraph [ref=e641]: 本组件没有 allowClear、loading、自定义输入节点或浮层容器属性。当前真实浏览器证据为 Chromium，其他浏览器、打包消费者与共享弹层完整验收留待工程回归。
          - generic [ref=e642]: Solid Upthrust · 基于 Solid 2 构建