          - region [ref=f17e771]:
            - heading "布局、样式与可访问性" [level=2] [ref=f17e772]
            - generic [ref=f17e773]:
              - paragraph [ref=f17e774]: horizontal 为默认布局，labelWidth、labelAlign、labelWrap 控制标签列；vertical 将标签置于控件上方，inline 适合紧凑查询条件。requiredMark、colon、tooltip、help、extra 和 hasFeedback 都有独立语义，不要只依赖颜色表达错误。
              - paragraph [ref=f17e775]: 有 name 的 Item 自动生成稳定 id 并将 label for 指向控件；自定义物料应透传 id、disabled、aria-invalid，并提供可访问名称。当前真实浏览器回归覆盖 Chromium；不据此宣称 Firefox/WebKit 已验证。
          - region [ref=f17e776]:
            - heading "与 Ant Design 6 的差异" [level=2] [ref=f17e777]
            - generic [ref=f17e778]:
              - paragraph [ref=f17e779]: 本实现参考 Ant Design 6 Form 的字段、规则、列表和实例组织，但不是 API 完全兼容实现。组件使用 Solid 2 的 signal/context 模型，onChange 以 value 为主，子组件不通过 cloneElement 注入；默认校验文案为中文。
              - paragraph [ref=f17e780]: 已覆盖：Form.Item、Form.List、嵌套 NamePath、initialValues/initialValue、preserve、动态增删、依赖、异步校验、warningOnly、validateFirst、validateDebounce、normalize、getValueFromEvent、reset/submit 和自定义上下文物料。未实现或尚未承诺的差异以本页限制为准。
          - region [ref=f17e781]:
            - heading "常见用法与边缘场景" [level=2] [ref=f17e782]
            - generic [ref=f17e783]:
              - paragraph [ref=f17e784]:
                - strong [ref=f17e785]: 初始值与回填：
                - text: initialValues 只在表单实例初始化时读取；编辑页拿到接口数据后使用 setFieldsValue，切换记录时先 resetFields 再写入。字段级 initialValue 适合动态 Item，Form.List 的初始数组优先放在 Form.List 的 initialValue 或 Form 的 initialValues 中。
              - paragraph [ref=f17e786]:
                - strong [ref=f17e787]: 动态列表：
                - text: Form.List 的 fields.name 是当前索引，fields.key 是稳定渲染键。遍历时使用 keyed，字段使用 [field.name, 'property']；嵌套列表继续把当前行路径传给下一级 Form.List。删除、移动后不要缓存旧索引，依赖当前 field descriptor 解析路径。
              - paragraph [ref=f17e788]:
                - strong [ref=f17e789]: 自定义物料：
                - text: 编辑型控件使用上下文协议或响应式 props；带参 render props 在字段值变化时会重新执行，适合派生展示。第一方物料通过 FormItemContext 接收 value、onChange、id、disabled、size 和校验状态。自定义控件必须透传 id、aria-invalid、disabled，并在 onChange 中把值交给 Form.Item，而不是只修改本地 signal。
              - paragraph [ref=f17e790]:
                - strong [ref=f17e791]: 表单套表单：
                - text: 嵌套的 Form 拥有独立实例和提交边界；内层使用 component="div" 与实例 submit()，内层提交不会触发外层 onFinish。若业务只是分组而不是独立提交，请使用 Form.Item 的无 name 布局区域，避免不必要地创建嵌套原生 form。
              - paragraph [ref=f17e792]:
                - strong [ref=f17e793]: 校验边缘：
                - text: async validator 应在过期请求完成后忽略旧结果；依赖字段只重新校验已经编辑的字段。validateOnly 适合提交前预检，warningOnly 不阻止提交，validateDebounce 适合远程校验。组件当前不提供 scrollToFirstError，请在 onFinishFailed 中根据 errorFields 自行聚焦。
          - region [ref=f17e794]:
            - heading "FAQ" [level=2] [ref=f17e795]
            - generic [ref=f17e796]:
              - paragraph [ref=f17e797]:
                - strong [ref=f17e798]: 为什么改变 initialValues 不会更新表单？
                - text: 这是一次性初始化配置。响应式业务数据应调用 setFieldsValue；不要把 initialValues 当作受控 value。
              - paragraph [ref=f17e799]:
                - strong [ref=f17e800]: 为什么 Form.List 行内依赖要写相对路径？
                - text: Form.Item 会自动追加当前列表行前缀，因此同一行字段依赖写 ['price']，不要手工拼接数组索引；嵌套列表按当前层级继续使用相对路径。
              - paragraph [ref=f17e801]:
                - strong [ref=f17e802]: 为什么自定义控件没有自动写入？
                - text: Solid 没有 React 的 cloneElement 注入。使用第一方控件，或通过 useFormItem 协议同步值；如果显式传入 onChange，它会优先于上下文协议。
              - paragraph [ref=f17e803]:
                - strong [ref=f17e804]: 何时使用 FormInstance？
                - text: 用户输入优先由 Form.Item 管理；接口回填、重置、校验、读取快照、跨字段联动和提交按钮放在表单外时，再通过 form/ref 使用命令式 API。
          - generic [ref=f17e805]: Solid Upthrust · 基于 Solid 2 构建