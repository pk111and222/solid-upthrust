        - heading "Form 表单" [level=1] [ref=f22e21]
        - paragraph [ref=f22e22]: 字段收集、校验、动态列表、依赖和自定义控件。
        - region [ref=f22e23]:
          - heading "使用方式" [level=2] [ref=f22e24]
          - generic [ref=f22e25]:
            - paragraph [ref=f22e26]: Form 由数据引擎与 UI 协议组成：Form 创建或接收 createForm() 实例，Form.Item 注册 NamePath 字段，首方控件通过 FormItemContext 接收 value、onChange、disabled、size、id 和校验状态。
            - code [ref=f22e28]: "import Form, { FormItem, FormList } from 'upthrust-ui/source/Form' import Input from 'upthrust-ui/source/Input' <Form onFinish={values => console.log(values)}> <FormItem name=\"username\" label=\"用户名\" rules={[{ required: true }]}> <Input /> </FormItem> </Form>"
            - paragraph [ref=f22e29]: 显式控件属性优先于 Form.Item 注入；显式 onChange 会接管写入，若仍需字段同步请在回调中调用 useFormItem().onChange。Solid 版本不复制 React 子节点，而是使用上下文协议。
            - paragraph [ref=f22e30]: 并列操作按钮使用 Flex gap=8 wrap="wrap" 或 Space 统一留白；Button 自身不设置外边距。带参 render props 适合派生展示，编辑控件建议直接作为子组件，使用 Form.Item 上下文保持节点与焦点稳定。
