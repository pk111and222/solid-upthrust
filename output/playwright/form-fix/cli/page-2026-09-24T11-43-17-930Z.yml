          - heading "Form 表单" [level=1] [ref=e102]
          - paragraph [ref=e103]: 字段收集、校验、动态列表、依赖和自定义控件。
          - region [ref=e104]:
            - heading "使用方式" [level=2] [ref=e105]
            - generic [ref=e106]:
              - paragraph [ref=e107]: Form 由数据引擎与 UI 协议组成：Form 创建或接收 createForm() 实例，Form.Item 注册 NamePath 字段，首方控件通过 FormItemContext 接收 value、onChange、disabled、size、id 和校验状态。
              - code [ref=e109]: "import Form, { FormItem, FormList } from 'upthrust-ui/source/Form' import Input from 'upthrust-ui/source/Input' <Form onFinish={values => console.log(values)}> <FormItem name=\"username\" label=\"用户名\" rules={[{ required: true }]}> <Input /> </FormItem> </Form>"
              - paragraph [ref=e110]: 显式控件属性优先于 Form.Item 注入；显式 onChange 会接管写入，若仍需字段同步请在回调中调用 useFormItem().onChange。Solid 版本不复制 React 子节点，而是使用上下文协议。
