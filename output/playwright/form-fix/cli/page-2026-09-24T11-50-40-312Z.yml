          - region [ref=f8e358]:
            - heading "校验与依赖" [level=2] [ref=f8e359]
            - generic [ref=f8e360]:
              - paragraph [ref=f8e361]: 规则支持 async-validator 的常用类型校验和自定义 validator；validator 可以返回 Promise，也可以使用 callback。validateFirst 为 true 时串行短路，parallel 时第一个失败先返回；较新的校验会淘汰旧结果，避免异步乱序覆盖。
              - paragraph [ref=f8e362]: dependencies 只对已编辑字段触发级联校验；Form.List 内的相对依赖会追加当前列表行路径。validateOnly 只运行规则而不写入错误状态，dirty 只校验已编辑字段。
              - paragraph [ref=f8e363]: 当前不支持 antd 的 message API、scrollToFirstError、validateFieldsAndScroll、Form.Provider、Form.useWatch 静态 Hook；对应能力请使用 onFinishFailed、form.watch、原生 focus 或应用层协调。
          - region [ref=f8e364]:
            - heading "Form 实例" [level=2] [ref=f8e365]
            - generic [ref=f8e366]:
              - paragraph [ref=f8e367]: 通过 ref 读取 getFieldValue/getFieldsValue/getFieldsError，使用 setFieldValue/setFieldsValue/setFields 更新，resetFields 重置，validateFields 校验，submit 执行校验并触发 onFinish。watch(pathOrSelector) 返回 Solid signal，并附带 dispose。
              - paragraph [ref=f8e368]: initialValues 只初始化一次；不要把它当作响应式受控值。需要异步回填或编辑切换时调用 setFieldsValue，切换记录时先 resetFields 再写入新值。
