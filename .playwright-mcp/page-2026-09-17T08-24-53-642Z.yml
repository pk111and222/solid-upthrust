          - region [ref=e530]:
            - heading "位置与样式" [level=2] [ref=e531]
            - generic [ref=e532]:
              - paragraph [ref=e533]: PopoverPlacement 使用 TriggerPlacement 的十二种位置：topLeft、top、topRight、bottomLeft、bottom、bottomRight、leftTop、left、leftBottom、rightTop、right、rightBottom。默认 top；这是首选位置，视口空间不足时可能翻转或偏移，翻转后浮层箭头会跟随实际朝向重新计算。
              - paragraph [ref=e534]: class/style 只影响触发区域根容器。浮层通过 Portal 渲染，使用 overlayClass/overlayStyle 定制；overlayStyle 合并在内部定位样式之后，可用于追加或覆盖 z-index 等字段，但不要覆盖 position、top、left、transform，否则需要自行负责定位。
              - paragraph [ref=e535]: 局部 ConfigProvider 的主题 CSS 变量可通过内部 ConfigPortal 延续到浮层，surface 控制背景，onSurface 控制文字。传入 getContainer 可以让浮层脱离最近主题作用域，挂载到指定容器（例如 document.body）。
              - paragraph [ref=e536]:
                - text: Popover 会读取 ConfigProvider 的
                - code [ref=e537]: components.Popover
                - text: 默认值，但仅限 trigger、placement 两项；显式 props 始终优先于该默认值。size、disabled 等全局默认不会注入到 Popover。
          - region [ref=e538]:
            - heading "键盘与无障碍" [level=2] [ref=e539]
            - generic [ref=e540]:
              - paragraph [ref=e541]: 浮层带 role="dialog"（区别于 Tooltip 的 role="tooltip"），因为卡片内容可以承载按钮等交互元素，ARIA tooltip 语义不允许这样做。trigger="focus" 可配合 Tab 键让键盘用户不依赖鼠标打开卡片。
              - paragraph [ref=e542]: Popover 不会自动把焦点移入卡片或管理卡片内部的键盘导航——内容是任意的，交由使用者自行决定内部控件的 Tab 顺序；这与 Dropdown 的固定菜单列表（需要方向键在候选项间循环）不同。Escape 关闭、点击外部关闭由共享 Trigger 统一处理。
          - region [ref=e543]:
            - heading "状态与支持边界" [level=2] [ref=e544]
            - generic [ref=e545]:
              - paragraph [ref=e546]: 不传 open 时为非受控模式，defaultOpen 仅决定初次挂载状态；传入 open 后为受控模式，onOpenChange 只报告布尔开关请求，父层需更新 open 才会改变显示。
              - paragraph [ref=e547]: disabled 默认 false，阻止用户发起开关请求；title 与 content 都为空时等效禁用。若浮层已经处于打开状态后 disabled 才变为 true（包括内容变空的情形），浮层不会被强制关闭（继承共享 Trigger 语义），但会立即隐藏，不会残留一张空卡片；条件解除后无需用户重新触发即可恢复可见。
              - paragraph [ref=e548]: 浮层按需挂载，关闭后延迟销毁；短时间内重新打开可复用浮层 DOM，卸载 Popover 则结束该实例。延迟时间属于内部实现，不是可配置的 Popover 属性。
              - paragraph [ref=e549]: Popover 没有 mouseEnterDelay/mouseLeaveDelay 这类延迟配置——hover 打开是即时的（0ms），关闭沿用共享 Trigger 的 100ms 默认防抖；这与 Tooltip 显式对齐 antd 的 100ms 打开延迟不同，是两者的既有差异，不代表缺陷。没有 ref 实例、静态子组件或异步确认协议；不承诺与其他组件库完全一致。
          - generic [ref=e550]: Solid Upthrust · 基于 Solid 2 构建
