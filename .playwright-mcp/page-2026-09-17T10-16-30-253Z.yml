            - generic [ref=f2e759]:
              - paragraph [ref=f2e760]:
                - text: 标签栏本身遵循 WAI-ARIA APG 的 tabs 模式：容器
                - code [ref=f2e761]: role="tablist"
                - text: 不占用独立的 Tab 停靠点（
                - code [ref=f2e762]: tabindex=-1
                - text: ），只有当前激活的标签是 Tab 键唯一停靠点（
                - code [ref=f2e763]: tabindex=0
                - text: ），其余标签
                - code [ref=f2e764]: tabindex=-1
                - text: 。
              - list [ref=f2e765]:
                - listitem [ref=f2e766]: 方向键（ArrowRight/ArrowDown 前进，ArrowLeft/ArrowUp 后退）在可用标签间循环切换 activeKey，并把 DOM 焦点跟随移动到新激活的标签，跳过禁用项；焦点已经在标签栏内时才会跟随，避免受控 activeKey 从页面其他地方更新时意外抢焦点。
                - listitem [ref=f2e767]: editable 模式下，聚焦某个标签后按 Delete 请求关闭该标签（等同点击关闭按钮）。
                - listitem [ref=f2e768]: draggable 模式下，Alt+ArrowLeft / Alt+ArrowRight 在不使用鼠标的情况下与相邻标签互换顺序。
              - paragraph [ref=f2e769]:
                - text: 面板
                - code [ref=f2e770]: role="tabpanel"
                - text: ；默认模式下非激活面板仍挂载但
                - code [ref=f2e771]: "display: none"
                - text: 隐藏，不会被无障碍工具读到。
          - region [ref=f2e772]:
            - heading "状态与支持边界" [level=2] [ref=f2e773]
            - generic [ref=f2e774]:
              - paragraph [ref=f2e775]: 不传 activeKey 时为非受控模式，defaultActiveKey 仅决定初次挂载的选中项（默认取第一个非禁用项）；传入 activeKey 后为受控模式，onChange 只报告切换请求，父层需更新 activeKey 才会改变实际选中项。
              - paragraph [ref=f2e776]: items 归调用者所有：add/remove/reorder 都只通过 onEdit/onReorder 请求变更，组件不会直接修改传入的数组，也不在内部维持一份脱离 props 的影子列表——onReorder 触发后若父层未同步更新 items，下一次渲染会用父层的原始顺序覆盖临时排序结果。
              - paragraph [ref=f2e777]: draggable 基于原生 HTML5 drag/drop API；触摸设备没有对应的拖拽手势支持，依赖 draggable 的排序在触摸设备上请提供 Alt+方向键之外的替代交互（例如上下移动按钮），本库不内置触摸拖拽回退。
              - paragraph [ref=f2e778]: 当前没有可关闭确认（关闭即立即请求，不等待用户确认对话框）、没有溢出滚动/更多菜单（标签数量超出容器宽度时不会自动出现滚动箭头或折叠菜单，需要调用者自行控制 items 数量或换行样式）。不承诺与其他组件库完全一致；请以本页公开类型与行为约定为准。
